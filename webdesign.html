<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box1{
            background-color: orangered;
            height: 250px;
            width: 250px;
            border-radius: 0px;
            box-shadow: 2px 1px 1px black;
            transition: ease-in-out 2s;
        }

        .box1:hover{
            background-color: orange;
            box-shadow: -2px 10px 1px grey;
            border-radius: 50px;
            transform: translate(20px,20px);
            transform: rotate3d(5deg,40deg,50deg);
        }

        .box1>active{
            background-color: aqua;
        }

        #txt{
            margin: 2px 3px 2px 3px;
            padding: 10%;
        }
    </style>
</head>
<body>
    <div class="box1">
        <div class="img">
            <img src="" alt="">
        </div>
        <div id="txt">Lorep ipsum dolor a relum</div>
    </div>
</body>
</html>
